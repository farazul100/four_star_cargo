# Hostinger VPS Nginx Reverse Proxy Configuration
# M/S Four Star Cargo Management System

server {
    listen 80;
    server_name fourstarcargo.com www.fourstarcargo.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fourstarcargo.com www.fourstarcargo.com;

    # Let's Encrypt SSL Certificates
    ssl_certificate /etc/letsencrypt/live/fourstarcargo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fourstarcargo.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Reverse Proxy to PM2 Node App (Port 5000)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static Asset Caching
    location /assets/ {
        proxy_pass http://127.0.0.1:5000/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Error Page
    error_page 500 502 503 504 /500.html;
    location = /500.html {
        root /var/www/fourstarcargo/dist;
    }
}
